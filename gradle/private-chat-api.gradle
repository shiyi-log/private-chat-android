// Application credentials belong to the operator, not to the source snapshot.
ext.privateChatApiConfig = {
    def localProperties = new Properties()
    def propertiesFile = rootProject.file('local.properties')
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { localProperties.load(it) }
    }

    def configuredValue = { String name ->
        def value = providers.environmentVariable(name).orNull
        if (value == null) {
            value = localProperties.getProperty(name)
        }
        value?.trim()
    }

    def apiId = configuredValue('PRIVATE_CHAT_API_ID')
    def apiHash = configuredValue('PRIVATE_CHAT_API_HASH')
    if (!apiId || !(apiId ==~ /[1-9][0-9]{0,9}/) || apiId.toBigInteger() > Integer.MAX_VALUE) {
        throw new GradleException('Set PRIVATE_CHAT_API_ID to a positive 32-bit integer in the environment or local.properties.')
    }
    if (!apiHash || !(apiHash ==~ /[0-9a-fA-F]{32}/)) {
        throw new GradleException('Set PRIVATE_CHAT_API_HASH to 32 hexadecimal characters in the environment or local.properties.')
    }
    [apiId: apiId.toInteger(), apiHash: apiHash]
}
